name: Build and deploy

# Builds the site on every push to main and publishes it to the gh-pages branch.
# GitHub Pages must be configured with Source = "Deploy from a branch", branch gh-pages, folder / (root).
# PR previews live in pr-preview/ on the same branch (see pr-preview.yml) and are kept across deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate records (schema, cross-references)
        run: npm run validate
      - name: Lint prose for bare numbers (warnings only)
        run: npm run lint:prose
      - name: Check that the exported JSON Schema is up to date
        run: |
          npm run schema
          git diff --exit-code -- schema || (echo "::error::schema/*.json is stale – run 'npm run schema' and commit the result" && exit 1)
      - name: Build site
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables) override the defaults:
          #   SITE_URL       e.g. https://robotdatasets.wiki   (custom domain)
          #   SITE_BASE      e.g. /                            (custom domain; a repository named <owner>.github.io gets / automatically)
          #   CUSTOM_DOMAIN  e.g. robotdatasets.wiki           (writes the CNAME file Pages needs)
          VAR_SITE_URL: ${{ vars.SITE_URL }}
          VAR_SITE_BASE: ${{ vars.SITE_BASE }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          export SITE_URL="${VAR_SITE_URL:-https://${OWNER_LC}.github.io}"
          if [ -n "$VAR_SITE_BASE" ]; then export SITE_BASE="$VAR_SITE_BASE";
          else if [ "$REPO_LC" = "${OWNER_LC}.github.io" ]; then export SITE_BASE="/"; else export SITE_BASE="/$REPO"; fi; fi
          echo "Building for $SITE_URL$SITE_BASE"
          npm run build
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > dist/CNAME; fi
      - name: Publish to the gh-pages branch (keeps pr-preview/)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview
          commit-message: "deploy: ${{ github.sha }}"
